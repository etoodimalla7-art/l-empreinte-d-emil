<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Admin — Concours & Parrainage</title>
<link rel="icon" type="image/png" href="https://i.postimg.cc/HLdg7Tb5/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>
<style>
:root { --gold:#C9A84C; --gold-light:#E8C97A; --noir:#0A0A0A; --dark:#111111; --dark-2:#1A1A1A; --dark-3:#222222; --muted:#888888; --light:#F5F0E8; --danger:#C0392B; --success:#27AE60; --font-display:'Cormorant Garamond',serif; --font-body:'Jost',sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); background: var(--noir); color: var(--light); font-size: 14px; line-height: 1.6; }
.container { max-width: 1000px; margin: 0 auto; padding: 20px 16px; }
.nav { background: var(--dark-2); border-bottom: 1px solid rgba(201,168,76,.15); padding: 16px; }
.nav-inner { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto; flex-wrap: wrap; gap: 10px;}
.nav-logo { font-family: var(--font-display); color: var(--gold); font-size: 20px; text-decoration: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; transition: .2s; text-decoration: none; }
.btn-primary { background: var(--gold); color: var(--noir); }
.btn-primary:hover { background: var(--gold-light); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid rgba(192,57,43,.3); }
.btn-danger:hover { background: rgba(192,57,43,.1); }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid rgba(245,240,232,.15); }
.btn-ghost:hover { color: var(--light); border-color: rgba(245,240,232,.3); }
.login-box { max-width: 380px; margin: 80px auto; background: var(--dark-2); border: 1px solid rgba(201,168,76,.2); border-radius: 12px; padding: 32px; text-align: center; }
.login-box h2 { font-family: var(--font-display); font-size: 24px; color: var(--gold); margin-bottom: 20px; }
.input-group { margin-bottom: 16px; text-align: left; }
.input-group label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
.input-group input, .input-group textarea, .input-group select { width: 100%; background: var(--dark-3); border: 1px solid rgba(201,168,76,.2); border-radius: 6px; padding: 12px; color: var(--light); font-size: 14px; font-family: inherit; outline: none; }
.input-group input:focus, .input-group textarea:focus { border-color: var(--gold); }
.hidden { display: none !important; }
.tabs { display: flex; gap: 6px; margin-bottom: 24px; border-bottom: 1px solid rgba(201,168,76,.1); padding-bottom: 12px; overflow-x: auto; }
.tab { padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--muted); border-radius: 6px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; border: none; background: none; font-family: inherit; }
.tab.active { background: var(--gold); color: var(--noir); }
.tab:hover:not(.active) { background: rgba(201,168,76,.1); color: var(--gold); }
.panel { display: none; }
.panel.active { display: block; animation: fade .3s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.card { background: var(--dark-2); border: 1px solid rgba(201,168,76,.1); border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; gap: 12px; align-items: flex-start; }
.card-img { width: 60px; height: 60px; border-radius: 6px; background: var(--dark-3); object-fit: cover; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.card-body { flex: 1; }
.card-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.card-meta { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">L'EMPREINTE D'EMIL · Admin</a>
    <div style="display:flex;gap:8px;">
      <a href="concours.html" class="btn btn-ghost" target="_blank">Voir concours</a>
      <button class="btn btn-danger" onclick="logout()" id="btn-logout" style="display:none">Déconnexion</button>
    </div>
  </div>
</nav>

<div class="container">
  <div id="login-view" class="login-box">
    <h2>Accès Administrateur</h2>
    <div class="input-group"><label>Mot de passe</label><input type="password" id="pwd" placeholder="••••••••"></div>
    <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Se connecter</button>
  </div>

  <div id="admin-view" class="hidden">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('lots', this)">Lots</button>
      <button class="tab" onclick="switchTab('quiz', this)">Quiz</button>
      <button class="tab" onclick="switchTab('share', this)">Partage & Messages</button>
      <button class="tab" onclick="switchTab('parts', this)">Participants</button>
      <button class="tab" onclick="switchTab('ref', this)">Parrainage</button>
    </div>

    <div id="panel-lots" class="panel active">
      <div style="background:var(--dark-2);border:1px solid rgba(201,168,76,.15);border-radius:8px;padding:16px;margin-bottom:20px">
        <h3 style="font-size:14px;color:var(--gold);margin-bottom:12px;text-transform:uppercase;letter-spacing:.1em">Ajouter un lot</h3>
        <div class="input-group"><label>Nom du lot</label><input id="lot-name" placeholder="Ex: Parfum Oud Royal"></div>
        <div class="input-group"><label>Description</label><textarea id="lot-desc" rows="2"></textarea></div>
        <div class="input-group"><label>URL de l'image</label><input id="lot-img" placeholder="https://..."></div>
        <div class="input-group"><label>Rang</label><select id="lot-rank"><option value="first">1er Prix</option><option value="second">2e Prix</option><option value="third">3e Prix</option><option value="consolation">Consolation</option></select></div>
        <button class="btn btn-primary" style="width:100%" onclick="addLot()">Ajouter le lot</button>
      </div>
      <div id="lots-list"></div>
    </div>

    <div id="panel-quiz" class="panel">
      <div style="background:var(--dark-2);border:1px solid rgba(201,168,76,.15);border-radius:8px;padding:16px;margin-bottom:20px">
        <h3 style="font-size:14px;color:var(--gold);margin-bottom:12px;text-transform:uppercase;letter-spacing:.1em">Ajouter une question</h3>
        <div class="input-group"><label>Question</label><input id="q-text" placeholder="Ex: Quelle est la capitale du Cameroun ?"></div>
        <div id="q-answers">
          <div class="input-group"><label>Réponse 1</label><input placeholder="Réponse 1"></div>
          <div class="input-group"><label>Réponse 2</label><input placeholder="Réponse 2"></div>
        </div>
        <button class="btn btn-ghost" style="width:100%;margin-bottom:10px" onclick="addAnswer()">+ Ajouter une réponse</button>
        <div class="input-group"><label>Numéro de la bonne réponse (ex: 1)</label><input id="q-correct" type="number" min="1"></div>
        <button class="btn btn-primary" style="width:100%" onclick="addQuiz()">Ajouter la question</button>
      </div>
      <div id="quiz-list"></div>
    </div>

    <div id="panel-share" class="panel">
      <div style="background:var(--dark-2);border:1px solid rgba(201,168,76,.15);border-radius:8px;padding:16px">
        <div class="input-group"><label>Lien à partager (Page concours)</label><input id="share-link"></div>
        <div class="input-group"><label>Message WhatsApp</label><textarea id="share-msg" rows="3"></textarea></div>
        <hr style="border-color:rgba(201,168,76,.1);margin:16px 0">
        <h3 style="font-size:14px;color:var(--gold);margin-bottom:12px;text-transform:uppercase">Messages de fin (Score)</h3>
        <div class="input-group"><label>Score minimum pour réussir (ex: 3)</label><input id="quiz-pass-score" type="number" min="0"></div>
        <div class="input-group"><label>Message si RÉUSSITE</label><textarea id="quiz-success-msg" rows="2" placeholder="Félicitations, vous êtes qualifié !"></textarea></div>
        <div class="input-group"><label>Message si ÉCHEC</label><textarea id="quiz-fail-msg" rows="2" placeholder="Dommage, retentez votre chance !"></textarea></div>
        <button class="btn btn-primary" style="width:100%" onclick="saveShareConfig()">Tout Enregistrer</button>
      </div>
    </div>

    <div id="panel-parts" class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <span style="font-size:13px;color:var(--muted)" id="part-count">0 participants</span>
        <button class="btn btn-ghost" onclick="loadParticipants()">Rafraîchir</button>
      </div>
      <div id="parts-list"></div>
    </div>

    <div id="panel-ref" class="panel">
      <div style="background:var(--dark-2);border:1px solid rgba(201,168,76,.15);border-radius:8px;padding:16px;margin-bottom:20px">
        <h3 style="font-size:14px;color:var(--gold);margin-bottom:12px;text-transform:uppercase">Récompenses de Parrainage</h3>
        <div class="input-group"><label>Points gagnés par le PARRAIN (inviteur)</label><input id="ref-pts-parrain" type="number" placeholder="500"></div>
        <div class="input-group"><label>Points gagnés par le FILLEUL (invité)</label><input id="ref-pts-filleul" type="number" placeholder="200"></div>
        <div class="input-group"><label>Valeur de 1000 points en FCFA (ex: 2000)</label><input id="ref-val-pts" type="number" placeholder="2000"></div>
        <button class="btn btn-primary" style="width:100%" onclick="saveRefConfig()">Enregistrer les règles</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 style="font-size:14px;color:var(--gold);text-transform:uppercase">Historique des Parrainages</h3>
        <button class="btn btn-ghost" onclick="loadReferrals()">Rafraîchir</button>
      </div>
      <div id="ref-list"></div>
    </div>

  </div>
</div>

<script>
const FIREBASE_CONFIG = { apiKey: 'AIzaSyA65BPcrGTDxZb-kGzTGcLKnTbZ4jcf-8k', authDomain: 'lempreinte-d-emil.firebaseapp.com', databaseURL: 'https://lempreinte-d-emil-default-rtdb.europe-west1.firebasedatabase.app', projectId: 'lempreinte-d-emil', storageBucket: 'lempreinte-d-emil.firebasestorage.app', messagingSenderId: '979069264735', appId: '1:979069264735:web:7a0dc52ffd296ac7a5ccea' };
let db = null;
try { if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database(); } catch(e) { console.error(e); }

const DEFAULT_PWD = 'emil2026';
let isLogged = false, lots = [], quiz = [], parts = [], referrals = [];

function esc(s) { return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function checkPwd(pwd) { if (!db) return pwd === DEFAULT_PWD; try { const snap = await db.ref('concours/adminPassword').once('value'); return pwd === (snap.val() || DEFAULT_PWD); } catch(e) { return pwd === DEFAULT_PWD; } }

async function doLogin() {
  const pwd = document.getElementById('pwd').value;
  if (await checkPwd(pwd)) {
    isLogged = true;
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('admin-view').classList.remove('hidden');
    document.getElementById('btn-logout').style.display = 'inline-flex';
    loadAll(); loadReferrals();
    // Zéro refresh : on écoute les nouveaux parrainages et participants en direct
    if(db){
      db.ref('concours/participants').on('value', () => loadParticipants());
      db.ref('referrals').on('value', () => loadReferrals());
    }
  } else { alert('Mot de passe incorrect'); }
}
function logout() { location.reload(); }

function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
}

async function loadAll() {
  if (!db) return;
  const [l, q, s, settings] = await Promise.all([
    db.ref('concours/lots').once('value'), db.ref('concours/quiz').once('value'), db.ref('concours/shareConfig').once('value'), db.ref('concours/settings').once('value')
  ]);
  lots = l.val() ? Object.values(l.val()) : [];
  quiz = q.val() ? Object.values(q.val()) : [];
  const share = s.val() || {}; const cfg = settings.val() || {};
  
  document.getElementById('share-link').value = share.link || window.location.origin + '/concours.html';
  document.getElementById('share-msg').value = share.message || '';
  document.getElementById('quiz-pass-score').value = cfg.passScore || 3;
  document.getElementById('quiz-success-msg').value = cfg.successMsg || '';
  document.getElementById('quiz-fail-msg').value = cfg.failMsg || '';

  renderLots(); renderQuiz(); loadParticipants();
}

async function loadRefConfig() {
  if (!db) return;
  const snap = await db.ref('referralsConfig').once('value');
  const cfg = snap.val() || { ptsParrain: 500, ptsFilleul: 200, valPts: 2000 };
  document.getElementById('ref-pts-parrain').value = cfg.ptsParrain;
  document.getElementById('ref-pts-filleul').value = cfg.ptsFilleul;
  document.getElementById('ref-val-pts').value = cfg.valPts;
}

function renderLots() {
  const el = document.getElementById('lots-list');
  el.innerHTML = lots.length ? lots.map((lot, i) => `
    <div class="card">
      <div class="card-img">${lot.img ? `<img src="${esc(lot.img)}" style="width:100%;height:100%;object-fit:cover;border-radius:6px">` : '🎁'}</div>
      <div class="card-body"><div class="card-title">${esc(lot.name)}</div><div class="card-meta">${esc(lot.desc)}</div></div>
      <button class="btn btn-danger" onclick="delLot(${i})">✕</button>
    </div>`).join('') : '<div style="text-align:center;padding:20px;color:var(--muted)">Aucun lot</div>';
}

async function addLot() {
  const name = document.getElementById('lot-name').value.trim(); if (!name) return alert('Nom requis');
  lots.push({ name, desc: document.getElementById('lot-desc').value.trim(), img: document.getElementById('lot-img').value.trim(), rank: document.getElementById('lot-rank').value });
  await db.ref('concours/lots').set(lots);
  document.getElementById('lot-name').value = ''; document.getElementById('lot-desc').value = ''; document.getElementById('lot-img').value = '';
  renderLots();
}
async function delLot(i) { if (confirm('Supprimer ?')) { lots.splice(i, 1); await db.ref('concours/lots').set(lots); renderLots(); } }

function addAnswer() {
  const wrap = document.getElementById('q-answers'); const idx = wrap.children.length + 1;
  wrap.insertAdjacentHTML('beforeend', `<div class="input-group"><label>Réponse ${idx}</label><input placeholder="Réponse ${idx}"></div>`);
}
function renderQuiz() {
  const el = document.getElementById('quiz-list');
  el.innerHTML = quiz.length ? quiz.map((q, i) => `
    <div class="card"><div class="card-body"><div class="card-title">Q${i+1}. ${esc(q.question)}</div><div class="card-meta">Bonne réponse: ${esc(q.answers[q.correct])}</div></div><button class="btn btn-danger" onclick="delQuiz(${i})">✕</button></div>`).join('') : '<div style="text-align:center;padding:20px;color:var(--muted)">Aucune question</div>';
}
async function addQuiz() {
  const question = document.getElementById('q-text').value.trim(), correct = parseInt(document.getElementById('q-correct').value) - 1;
  const answers = Array.from(document.querySelectorAll('#q-answers input')).map(i => i.value.trim()).filter(Boolean);
  if (!question || answers.length < 2 || isNaN(correct) || correct < 0 || correct >= answers.length) return alert('Vérifiez les champs');
  quiz.push({ question, answers, correct }); await db.ref('concours/quiz').set(quiz);
  document.getElementById('q-text').value = ''; document.getElementById('q-correct').value = '';
  document.getElementById('q-answers').innerHTML = '<div class="input-group"><label>Réponse 1</label><input placeholder="Réponse 1"></div><div class="input-group"><label>Réponse 2</label><input placeholder="Réponse 2"></div>';
  renderQuiz();
}
async function delQuiz(i) { if (confirm('Supprimer ?')) { quiz.splice(i, 1); await db.ref('concours/quiz').set(quiz); renderQuiz(); } }

async function saveShareConfig() {
  await db.ref('concours/shareConfig').set({ link: document.getElementById('share-link').value.trim(), message: document.getElementById('share-msg').value.trim() });
  await db.ref('concours/settings').set({ passScore: parseInt(document.getElementById('quiz-pass-score').value) || 0, successMsg: document.getElementById('quiz-success-msg').value.trim(), failMsg: document.getElementById('quiz-fail-msg').value.trim() });
  alert('Configuration enregistrée');
}

async function loadParticipants() {
  if (!db) return;
  const snap = await db.ref('concours/participants').once('value');
  const val = snap.val(); parts = val ? Object.values(val) : [];
  parts.sort((a, b) => new Date(b.date) - new Date(a.date));
  document.getElementById('part-count').textContent = parts.length + ' participants';
  document.getElementById('parts-list').innerHTML = parts.length ? parts.map(p => `
    <div class="card">
      <div class="card-img" style="font-size:20px;font-weight:bold">${esc(p.name[0].toUpperCase())}</div>
      <div class="card-body">
        <div class="card-title">${esc(p.name)} · ${esc(p.phone)}</div>
        <div class="card-meta">${esc(p.city)} · Score: <b>${p.score || 0}/${p.totalQuestions || 0}</b> · ${new Date(p.date).toLocaleDateString('fr-FR')}</div>
      </div>
      <button class="btn btn-danger" onclick="delPart('${esc(p.id)}')">✕</button>
    </div>`).join('') : '<div style="text-align:center;padding:20px;color:var(--muted)">Aucun participant</div>';
}
async function delPart(id) { if (confirm('Supprimer ?')) { await db.ref('concours/participants/' + id).remove(); } }

async function loadRefConfigAndList() { await loadRefConfig(); await loadReferrals(); }

async function loadReferrals() {
  if (!db) return;
  const snap = await db.ref('referrals').once('value');
  const val = snap.val(); referrals = val ? Object.values(val) : [];
  referrals.sort((a, b) => new Date(b.date) - new Date(a.date));
  document.getElementById('ref-list').innerHTML = referrals.length ? referrals.map(r => `
    <div class="card">
      <div class="card-img" style="color:var(--gold)">👥</div>
      <div class="card-body">
        <div class="card-title">${esc(r.parrainName)} a invité ${esc(r.filleulName)}</div>
        <div class="card-meta">${new Date(r.date).toLocaleDateString('fr-FR')} · +${r.ptsParrain} pts pour le parrain · +${r.ptsFilleul} pts pour le filleul</div>
      </div>
    </div>`).join('') : '<div style="text-align:center;padding:20px;color:var(--muted)">Aucun parrainage enregistré</div>';
}

async function saveRefConfig() {
  const cfg = { ptsParrain: parseInt(document.getElementById('ref-pts-parrain').value) || 0, ptsFilleul: parseInt(document.getElementById('ref-pts-filleul').value) || 0, valPts: parseInt(document.getElementById('ref-val-pts').value) || 2000 };
  await db.ref('referralsConfig').set(cfg);
  alert('Règles de parrainage enregistrées !');
}

// Initial load pour l'onglet parrainage
if (isLogged) loadRefConfigAndList();
</script>
</body>
</html>
